<!doctype html>
<html><head><meta charset="utf-8"><title>Mock Reels</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui; }
  main { height: 100vh; display: flex; justify-content: center; }
  .scroller { height: 100vh; width: 420px; overflow-y: scroll; scroll-snap-type: y mandatory; }
  .reel { height: 100vh; scroll-snap-align: start; display: flex; gap: 12px; align-items: center; padding: 10px; box-sizing: border-box; }
  video { height: 90%; width: 320px; background: #222; border-radius: 8px; }
  .bar { display: flex; flex-direction: column; gap: 16px; }
  [role=button] { cursor: pointer; }
</style>
<script src="/shim.js"></script>
</head><body>
<main><div class="scroller">
  <script>
    for (let i = 1; i <= 5; i++) document.write(`
      <div class="reel" data-reel="${i}">
        <video playsinline></video>
        <div class="bar">
          <div role="button"><svg aria-label="${i === 3 ? "Unlike" : "Like"}" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg></div>
          <div role="button"><svg aria-label="Like" width="12" height="12" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="gray"/></svg></div>
          <span>#${i}</span>
        </div>
      </div>`);
  </script>
</div></main>
<script src="/content.js"></script>
</body></html>
