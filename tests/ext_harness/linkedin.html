<!doctype html>
<html><head><meta charset="utf-8"><title>Mock LinkedIn feed</title>
<style>
  body { margin: 0; background: #f4f2ee; font-family: system-ui; }
  .feed-shared-update-v2 { width: 555px; margin: 0 auto 12px; background: #fff; border-radius: 8px; padding: 12px; }
  .media { height: 520px; background: #dde; display: grid; place-items: center; font-size: 36px; }
  button { margin: 6px; }
  .comment button { font-size: 11px; }
</style>
<script src="/shim.js"></script>
</head><body>
<script>
  for (let i = 1; i <= 6; i++) document.write(`
    <div class="feed-shared-update-v2" data-urn="urn:li:activity:${i}">
      <div class="media">Post ${i}</div>
      <button aria-label="${i * 7} reactions">😊 ${i * 7}</button>
      <div>
        <button aria-label="React Like" aria-pressed="${i === 3}">👍 Like</button>
        <button aria-label="Comment">💬 Comment</button>
        <button aria-label="Repost">🔁</button>
      </div>
      <div class="comment">Nice! <button aria-label="React Like to Bob's comment" aria-pressed="false">Like</button></div>
    </div>`);
</script>
<script src="/content.js"></script>
</body></html>
